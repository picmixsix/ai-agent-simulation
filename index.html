<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>AI Agent 3D Virtual Office</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
        }
        
        /* Dashboard Overlay */
        #ui-dashboard {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            color: white;
            width: 300px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 10;
        }

        .header {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            border-bottom: 1px solid #475569;
            padding-bottom: 10px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #334155;
            border-radius: 4px;
            margin-top: 5px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #10b981; /* Green */
            width: 80%; /* Statis untuk testing */
        }

        .energy-fill { background: #3b82f6; width: 65%; }
        
        .current-action {
            margin-top: 15px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            font-size: 0.85rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <!-- UI Overlay -->
    <div id="ui-dashboard">
        <div class="header">Agent Status: Budi-01</div>
        
        <div class="stat-row">
            <span>Fokus Kerja</span>
            <span>80%</span>
        </div>
        <div class="progress-bar"><div class="progress-fill"></div></div>
        <br>
        <div class="stat-row">
            <span>Energi (Stamina)</span>
            <span>65%</span>
        </div>
        <div class="progress-bar"><div class="progress-fill energy-fill"></div></div>

        <div class="current-action">
            <strong>Aktivitas Saat Ini:</strong><br>
            Sedang menuju Gedung YouTube untuk render video recap...
        </div>
    </div>

    <!-- Script Three.js dari CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // 1. Setup Scene, Camera, & Renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#87CEEB'); // Warna langit cerah

        // Menggunakan Isometric Camera Perspective
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(20, 20, 20);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // 2. Setup Pencahayaan
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // 3. Membuat Permukaan Tanah (Ground)
        const groundGeometry = new THREE.PlaneGeometry(30, 30);
        const groundMaterial = new THREE.MeshStandardMaterial({ color: '#4ade80' }); // Hijau rumput
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // 4. Membangun Gedung-Gedung
        function createBuilding(color, x, z, name) {
            const geometry = new THREE.BoxGeometry(4, 6, 4);
            const material = new THREE.MeshStandardMaterial({ color: color });
            const building = new THREE.Mesh(geometry, material);
            building.position.set(x, 3, z); // Y=3 agar berdiri di atas tanah
            building.castShadow = true;
            scene.add(building);
            return building;
        }

        // Gedung Merah (YouTube) & Gedung Hitam (TikTok)
        createBuilding('#ef4444', -8, -8, 'YouTube HQ'); 
        createBuilding('#171717', 8, -8, 'TikTok HQ');

        // 5. Membuat AI Agent
        const agentGeometry = new THREE.SphereGeometry(1, 32, 32);
        const agentMaterial = new THREE.MeshStandardMaterial({ color: '#facc15' }); // Kuning
        const agent = new THREE.Mesh(agentGeometry, agentMaterial);
        agent.position.set(0, 1, 0);
        agent.castShadow = true;
        scene.add(agent);

        // 6. Animasi Loop Sederhana (Agent bergerak memutar)
        let angle = 0;
        function animate() {
            requestAnimationFrame(animate);

            // Membuat agent bergerak sedikit (sebagai placeholder sebelum ada logic LLM)
            angle += 0.02;
            agent.position.x = Math.sin(angle) * 5;
            agent.position.z = Math.cos(angle) * 5;

            renderer.render(scene, camera);
        }

        // Handle Resize Window
        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });

        animate();
    </script>
</body>
</html>
